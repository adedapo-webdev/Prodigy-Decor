<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weddings & Corporate Events | Prodigy Decor and Events</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #222222;
            color: #f8f5ee;
            line-height: 1.6;
        }

        header {
            padding: 22px 7%;
            background: #151411;
        }

        header a {
            color: #c6a15b;
            text-decoration: none;
        }

        .page-heading {
            text-align: center;
            padding: 55px 20px 35px;
        }

        .page-heading p {
            color: #c6a15b;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        h1 {
            font-family: Georgia, serif;
            font-weight: normal;
            font-size: clamp(30px, 5vw, 46px);
        }

        .photo-gallery {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 30px 55px;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 22px;
        }

        .photo-gallery img {
            display: block;
            width: 100%;
            height: 320px;
            object-fit: cover;
        }


        .photo-gallery video {
            display: block;
            width: 100%;
            height: 320px;
            object-fit: cover;
            background: #151411;
        }


        .back-link {
            display: block;
            text-align: center;
            color: #c6a15b;
            padding: 0 20px 40px;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            .photo-gallery {
                grid-template-columns: 1fr;
                padding: 0 18px 35px;
                gap: 16px;
            }

            .photo-gallery img {
                height: 280px;
            }
        }
    </style>
</head>

<body>

    <header>
        <a href="gallery.html">← Back to Gallery</a>
    </header>

    <section class="page-heading">
        <p>Our Portfolio</p>
        <h1>Behind The Scenes</h1>
    </section>

    <main class="photo-gallery">

        <img src="image/behind the scenes/behind the scenes 1.jpg"
            alt="behind the scenes 1">
        <img src="image/behind the scenes/behind the scenes 2.jpg"
            alt="behind the scenes 2">
        <img src="image/behind the scenes/behind the scenes 3.jpg"
            alt="behind the scenes 3">
        <img src="image/behind the scenes/behind the scenes 4.jpg"
            alt="behind the scenes 4">
        <img src="image/behind the scenes/behind the scenes 5.jpg"
            alt="behind the scenes 5">

        <video controls preload="metadata">
            <source src="image/behind the scenes/behind the scenes vid 1.mp4" type="video/mp4">
            Your browser does not support this video.
        </video>

        <video controls preload="metadata">
            <source src="image/behind the scenes/behind the scenes vid 2.mp4" type="video/mp4">
            Your browser does not support this video.
        </video>
    </main>


    <a class="back-link" href="gallery.html">Return to Gallery</a>

</body>

</html>
